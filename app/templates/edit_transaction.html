{% extends "base.html" %}

{% block title %}Edit transaction &middot; {{ app_title }}{% endblock %}

{% block content %}

    <div class="form-page">

        <div class="page-title">
            <h1>Edit transaction</h1>
            <p>Update this transaction's details.</p>
        </div>

        <section class="card">

            <form
                action="/transactions/{{ transaction.id }}/edit"
                method="post"
                class="form-grid"
            >

                <div class="field">
                    <label for="amount">Amount</label>

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        step="0.01"
                        min="0.01"
                        value="{{ transaction.amount }}"
                        required
                    >
                </div>


                <div class="field">
                    <label for="category">Category</label>

                    <input
                        type="text"
                        id="category"
                        name="category"
                        value="{{ transaction.category }}"
                        required
                    >
                </div>


                <div class="field">
                    <label for="description">Description</label>

                    <input
                        type="text"
                        id="description"
                        name="description"
                        value="{{ transaction.description }}"
                        required
                    >
                </div>


                <div class="field">
                    <label for="transaction_date">Date</label>

                    <input
                        type="date"
                        id="transaction_date"
                        name="transaction_date"
                        value="{{ transaction.transaction_date }}"
                        required
                    >
                </div>


                <button type="submit" class="btn">
                    Save changes
                </button>

            </form>


            <div class="form-foot">

                <a class="btn-ghost" href="/dashboard">
                    <svg class="icon"><use href="#i-back"/></svg>
                    Back to dashboard
                </a>

            </div>

        </section>

    </div>

{% endblock %}
