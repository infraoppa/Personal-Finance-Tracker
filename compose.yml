services:
  db:
    image: postgres:17
    container_name: finance-postgres

    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  app:
    image: finance-app:1
    ports:
    - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://finance_user:finance_password@db:5432/finance

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: